# electron-builder config for the Electron desktop shell. The base configuration
# is safe for local/source builds; official CI adds signing, notarization,
# transition metadata, and an architecture-specific updater feed.
#
# Preview packaging identity is locked to product-identity.json by contract
# tests. It must never collide with an installed upstream Abu distribution.
appId: com.abu.projectmanagement.preview
productName: Abu Project Management
copyright: Copyright © 2026 Shawn and Abu Project Management contributors
extraMetadata:
  abuRelease:
    # This fork is the Project Management edition by default. Official upstream
    # CI must override the distribution and officialBuild marker together.
    distribution: abu-project-management
    upstreamBaseVersion: 0.41.0
    # Source/fork builds are never allowed to inherit Abu's production updater.
    # Official release CI overrides this exact boolean together with `publish`.
    officialBuild: false
    # Only a release workflow may override this exact boolean to true.
    # Local/PR packages stay isolated from installed Tauri user data.
    tauriMigration: false
# Pin packaging to the Electron version resolved by package-lock.json so local
# worktrees and CI download the same runtime.
electronVersion: 43.1.1

# Keep ELECTRON_RUN_AS_NODE until the sidecar moves to standalone Node, while
# disabling user-controlled Node bootstrap and inspector entry points. Builder
# applies these immediately before its signing phase on every platform.
electronFuses:
  resetAdHocDarwinSignature: true
  runAsNode: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false

# Deep-link scheme registration (CFBundleURLTypes in Info.plist). macOS only
# delivers open-url events to packaged apps whose bundle DECLARES the scheme —
# app.setAsDefaultProtocolClient() alone is not enough (Electron docs: "you can
# only register protocols that have been added to your app's info.plist").
# electron/deepLinkHost.cjs reads the packaged and development Preview schemes
# from product-identity.json; neither path claims the upstream `abu` scheme.
protocols:
  - name: Abu Project Management Preview
    schemes:
      - abu-project-management-preview

directories:
  output: release-electron
  buildResources: build

# Deep-sign extraResources Mach-Os before the outer app signature and retain a
# pre-fuse automation clone for packaged acceptance. electronFuses above are
# applied to the real output immediately after this hook.
afterPack: scripts/electron-sign-nested.cjs

# Tight whitelist: exclude everything, then re-include exactly what the packaged
# app needs. The frontend (dist-electron-spike) and sidecar are self-contained
# bundles (vite / esbuild), so almost no node_modules are needed at runtime —
# node-pty is needed for real terminals; electron-updater and its production
# dependency closure are needed when the packaged updater host is first used.
files:
  - "!**/*"
  - "electron/**/*"
  - "!electron/**/*.test.cjs"        # development-only security/unit tests
  - "!electron/native-helper/**"   # Rust source + target/ (huge) — binary ships via extraResources
  - "!electron/sandbox-launcher/**" # Rust source + target/ (huge) — binary ships via extraResources
  - "!electron/browser-runtime/**" # bundled MCP server ships as a real-file extraResource
  - "!electron/chrome-bridge-runtime/**" # Chrome bridge ships once as a real-file extraResource
  - "!electron/spike/**"           # dev-only E2E harnesses
  - "!electron/renderer/**"        # placeholder page — real frontend is dist-electron-spike
  # previewServer.cjs reads this shared picker from app.asar at runtime.
  - "src-tauri/inspect/abu-preview-inspect.js"
  # computerUseGate.cjs loads the reviewed policy in Electron main.
  - "src/core/tools/computerUsePolicy.json"
  - "dist-electron-spike/**/*"
  - "package.json"
  - "product-identity.json"
  - "node_modules/node-pty/**/*"
  - "node_modules/electron-updater/**/*"
  - "node_modules/builder-util-runtime/**/*"
  - "node_modules/fs-extra/**/*"
  - "node_modules/semver/**/*"
  - "node_modules/debug/**/*"
  - "node_modules/ms/**/*"
  - "node_modules/sax/**/*"
  - "node_modules/graceful-fs/**/*"
  - "node_modules/jsonfile/**/*"
  - "node_modules/universalify/**/*"
  - "node_modules/js-yaml/**/*"
  - "node_modules/argparse/**/*"
  - "node_modules/lazy-val/**/*"
  - "node_modules/lodash.escaperegexp/**/*"
  - "node_modules/lodash.isequal/**/*"
  - "node_modules/tiny-typed-emitter/**/*"

# node-pty ships a native .node + spawn-helper binary; asar can't exec/inspect
# a binary in place, so unpack it to app.asar.unpacked/.
asarUnpack:
  - "**/node_modules/node-pty/**"

# Files that must live on the real filesystem (outside asar): the sidecar bundle
# (spawned as a child via Electron-as-Node), builtin skills/agents, the browser
# extension, and the native-helper binary (exec'd for computer-use). appEnv.cjs
# / nativeHelperManager.cjs resolve these under process.resourcesPath when
# packaged. Node/Python are pinned, hash-verified, and generated by the
# Electron-only runtime setup before electron-builder starts.
extraResources:
  - from: legal/LICENSE
    to: legal/LICENSE
  - from: legal/DISCLAIMER.md
    to: legal/DISCLAIMER.md
  - from: legal/DISCLAIMER.zh-CN.md
    to: legal/DISCLAIMER.zh-CN.md
  - from: legal/THIRD_PARTY_NOTICES.md
    to: legal/THIRD_PARTY_NOTICES.md
  - from: sidecar/index.mjs
    to: sidecar/index.mjs
  - from: builtin-skills
    to: builtin-skills
  - from: builtin-agents
    to: builtin-agents
  - from: electron/native-helper/target/release
    to: native-helper
    filter:
      - native-helper
      - native-helper.exe
      - tauri-transition-reader
      - tauri-transition-reader.exe
  - from: electron/sandbox-launcher/dist
    to: sandbox-launcher
  - from: electron/.runtime/node-runtime
    to: node-runtime
  # electron-builder intentionally filters a source-root node_modules folder.
  # The official Windows Node archive stores npm/npx there (macOS uses
  # lib/node_modules), so copy it from its own matcher root to retain the
  # bundled CLIs in Windows packages.
  - from: electron/.runtime/node-runtime/node_modules
    to: node-runtime/node_modules
  - from: electron/.runtime/python-runtime
    to: python-runtime
  - from: electron/runtime
    to: runtime-metadata
  - from: electron/browser-runtime/dist
    to: browser-runtime
  - from: electron/chrome-bridge-runtime/dist
    to: chrome-bridge-runtime
  - from: abu-chrome-extension/dist
    to: browser-extension
  # Tray icon candidates (guiHost.cjs resolveTrayIconPath) — src-tauri/ isn't
  # packed into asar, so the tray needs these under Resources/icons.
  - from: src-tauri/icons/32x32.png
    to: icons/32x32.png
  - from: src-tauri/icons/128x128.png
    to: icons/128x128.png
  # Windows command isolation combines the sandbox-launcher's restricted
  # primary token + Job Object process-tree ownership with PowerShell
  # ConstrainedLanguage for shell commands. Real Windows package/runtime
  # compatibility remains an attended acceptance gate.

# Auto-update feed (F-slice #2): generic provider pointed at the existing
# Aliyun OSS bucket that already serves the Tauri latest.json. When the dist
# build gains a dmg/zip target (F11, with signing), this block (1) embeds
# app-update.yml into the packaged app so electron-updater
# (electron/updaterHost.cjs) knows its feed without runtime config, and
# (2) generates latest-mac.yml with the artifact's sha512 (NEVER hand-write
# that file — a wrong hash makes every update get rejected). NOTE: the
# current `dir`-only target does NOT write app-update.yml (PublishManager
# only does for dmg/zip on darwin) — a dir-build's updater check soft-fails
# (rejected invoke → frontend catch), same non-fatal behavior as before this
# slice. Publishing artifacts to OSS stays a CI step; nothing is uploaded
# from dev machines.
# Source and fork packages deliberately have no updater provider. Official CI
# injects the generic provider plus the architecture-specific OSS URL and sets
# `abuRelease.officialBuild=true`. This prevents a modified fork from silently
# updating into the official Abu distribution.
publish: null

mac:
  category: public.app-category.productivity
  icon: src-tauri/icons/icon.icns
  # Let macOS pick the localized app name ("阿布") from
  # <locale>.lproj/InfoPlist.strings, written by the afterPack hook
  # (scripts/electron-localize-app-name.cjs) so Spotlight matches Chinese.
  extendInfo:
    LSHasLocalizedDisplayName: true
  artifactName: "${productName}-${version}-mac-${arch}.${ext}"
  # `npm run pack:electron` (--dir) still produces just the unpacked .app for
  # fast iteration + the packaged smoke. `npm run dist:electron` builds:
  #  - zip: REQUIRED for mac auto-update (Squirrel.Mac consumes a zip; its
  #    presence is also what makes electron-builder embed app-update.yml and
  #    emit latest-mac.yml with the artifact's sha512 — the feed files the
  #    updater slice consumes).
  #  - dmg: the user-facing installer artifact.
  # Both are UNSIGNED until the signing slice — fine for wiring verification,
  # NOT distributable.
  target:
    - zip
    - dmg
  # Signing plumbing (inert while identity stays null): hardened runtime +
  # the same entitlement set the Tauri build notarizes with (see
  # build/entitlements.mac.plist), plus an afterPack deep-sign of
  # extraResources Mach-Os (scripts/electron-sign-nested.cjs) that
  # electron-builder's own pass doesn't cover — notarization rejects any
  # unsigned nested Mach-O. Local signed dry-run:
  #   npx electron-builder --dir -c.mac.identity="Developer ID Application: ..."
  # CI imports the p12 into an explicit CSC_KEYCHAIN before electron-builder
  # starts and overrides this null with the generic "Developer ID Application"
  # qualifier. Keeping null here guarantees local pack:electron remains
  # unsigned even on a developer machine that has unrelated certs installed.
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # afterPack signs these real-file runtimes first and refreshes their integrity
  # markers with the signed executable hashes. Keep the outer signing pass from
  # rewriting them again; the outer app seal still covers every resource.
  signIgnore:
    - "/Contents/Resources/(native-helper|sandbox-launcher|python-runtime|node-runtime)/"
  # Default is UNSIGNED so dev builds need no certificate. The CI invocation
  # overrides this and forceCodeSigning; do NOT commit a real identity here.
  identity: null

win:
  icon: src-tauri/icons/icon.ico
  executableName: "Abu Project Management"
  # Windows baseline ships a conventional x64 NSIS installer. It is
  # deliberately per-user: no Microsoft Store packaging, no machine-wide
  # install, and no elevation prompt. Signing remains unset until a later
  # attended release stage with real credentials.
  target:
    - target: nsis
      arch:
        - x64
  artifactName: "Abu-Project-Management-RC1-Preview-windows-x64-setup.exe"

nsis:
  oneClick: true
  perMachine: false
  allowElevation: false
  packElevateHelper: false
  # Preview is independent and must not run the upstream Tauri transition hook.
  uninstallDisplayName: "Abu Project Management"
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: "Abu Project Management"
  runAfterFinish: false
  artifactName: "Abu-Project-Management-RC1-Preview-windows-x64-setup.exe"

linux:
  target:
    - dir
  category: Utility
