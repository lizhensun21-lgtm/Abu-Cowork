name: abu-pm-dev

services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: abu_pm_dev
      POSTGRES_USER: abu_pm_dev
      POSTGRES_PASSWORD: abu_pm_dev_only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - abu-pm-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U abu_pm_dev -d abu_pm_dev"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  abu-pm-postgres-data:
    name: abu-pm-postgres-data
